services:
  # ==========================================
  # Backend API: Miel-IA (FastAPI + ML)
  # ==========================================
  miel-ia-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-mirazopablo}/miel-ia:${IMAGE_TAG:-latest}
    container_name: miel_ia_backend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - mired2
    deploy:
      resources:
        limits:
          memory: 600M
        reservations:
          memory: 150M

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mired2"

      # Regla de enrutamiento por Host de Tailscale y Prefijos (Prefijo de servicio + Sub-prefijos directos)
      - "traefik.http.routers.mielia-api.rule=Host(`${SUBDOMAIN}`) && (PathPrefix(`/miel-ia`) || PathPrefix(`/mielia`) || PathPrefix(`/api`) || PathPrefix(`/diagnose`) || PathPrefix(`/users`) || PathPrefix(`/medical-studies`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`) || PathPrefix(`/static`))"
      - "traefik.http.routers.mielia-api.entrypoints=web"
      - "traefik.http.routers.mielia-api.priority=100"

      # Middleware para remover el prefijo /miel-ia o /mielia
      - "traefik.http.middlewares.mielia-strip.stripprefix.prefixes=/miel-ia,/mielia"

      # Aplicar middleware de remoción de prefijo
      - "traefik.http.routers.mielia-api.middlewares=mielia-strip"

      # Mapeo al puerto interno de FastAPI (8000)
      - "traefik.http.services.mielia-api.loadbalancer.server.port=8000"

      # Actualización automática con Watchtower
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mired2:
    external: true
