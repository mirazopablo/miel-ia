services:
  # ==========================================
  # Backend API: Miel-IA (GHCR Image)
  # ==========================================
  miel-ia-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER}/miel-ia:${IMAGE_TAG:-latest}
    container_name: miel_ia_backend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    networks:
      - mired2
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mired2"

      # Routing Rules
      - "traefik.http.routers.mielia.rule=Host(`${API_SUBDOMAIN}`)"
      - "traefik.http.routers.mielia.entrypoints=web"
      - "traefik.http.services.mielia.loadbalancer.server.port=8000"

      # Headers & Security Middleware Validation
      - "traefik.http.routers.mielia.middlewares=mielia-header-check"
      - "traefik.http.middlewares.mielia-header-check.headers.customrequestheaders.X-App-Secret=${X_APP_SECRET_TOKEN}"

      # Watchtower Automation Enable
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mired2:
    external: true


